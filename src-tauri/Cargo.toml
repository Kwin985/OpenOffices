[package]
name = "openoffices"
version = "0.63.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openoffices_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
# 文件关联二次启动把路径转发给已开实例（MIT/Apache，Tauri 官方插件）
tauri-plugin-single-instance = "2"
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
# 直接依赖以读取 xlsx 单元格样式/合并（calamine 不公开样式 API）；两者均已在依赖树中，零体积增量
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# CSV 读侧中文兼容（Excel 另存的 GBK 文件）；已在依赖树（url/tauri 传递），提为直接依赖零体积增量
encoding_rs = "0.8"
# 自动更新通道（MIT/Apache，Tauri 官方插件）。体积账实测（同一条 `cargo build --release`、同一份 dist，
# 只挂/摘这一个插件）：exe 从 7,093,760 → 9,001,984 字节，+1.82 MiB。涨在它自带一套 HTTPS 栈与解包器：
# Cargo.lock 多出 36 个包（rustls/ring/webpki 整条、minisign-verify、tar，以及第二份 zip 4.6.1——和我们
# 自己的 zip 8.6 并存，不是复用）。做成"只检测、下载与安装交给浏览器"是本版本刻意收窄范围，不是没做完：
# 接线 download+install 时才需要额外权限，见 README 的 v0.45 一节。
tauri-plugin-updater = "2"

# WebView2 PrintToPdf（导出 PDF）；两者已在依赖树（wry 传递），提为直接依赖零体积增量
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
