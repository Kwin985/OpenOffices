[package]
name = "openoffices"
version = "0.20.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openoffices_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
# 文件关联二次启动把路径转发给已开实例（MIT/Apache，Tauri 官方插件）
tauri-plugin-single-instance = "2"
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
# 直接依赖以读取 xlsx 单元格样式/合并（calamine 不公开样式 API）；两者均已在依赖树中，零体积增量
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

# WebView2 PrintToPdf（导出 PDF）；两者已在依赖树（wry 传递），提为直接依赖零体积增量
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
